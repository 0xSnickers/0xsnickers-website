name: Deploy to Server

on:
  push:
    branches:
      - main

env:
  NODE_VERSION_BUILD: 20
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # 解决 Node 20 警告

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js for Build
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION_BUILD }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build Next.js (Standalone)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          PROJECT_GITHUB_TOKEN: ${{ secrets.PROJECT_GITHUB_TOKEN }}

      - name: Pack release artifact
        run: |
          rm -rf release release.tar.gz
          mkdir -p release/.next/static

          cp -R .next/standalone/. release/
          cp -R .next/static/. release/.next/static/
          cp -R public release/public || true

          test -d release/.next/static/chunks
          find release/.next/static -maxdepth 2 -type f | head -20

          # 动态生成 .env 文件
          # 这样可以确保 PROJECT_GITHUB_TOKEN 总是取自你最新的 GitHub Secrets
          echo "PROJECT_GITHUB_TOKEN=${{ secrets.PROJECT_GITHUB_TOKEN }}" > release/.env
          
          # 如果你有其他环境变量，也可以继续追加
          # echo "OTHER_SECRET=${{ secrets.OTHER_SECRET }}" >> release/.env

          tar -czf release.tar.gz -C release .
          ls -lh release.tar.gz

      - name: Upload to Server (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "release.tar.gz"
          target: ${{ secrets.PROJECT_PATH }}
          overwrite: true

      - name: Activate Release on Server (PM2)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 10m
          script: |
            set -e

            APP_DIR="${{ secrets.PROJECT_PATH }}"
            RELEASE_DIR="$APP_DIR/current"
            NEXT_DIR="$APP_DIR/next-release"
            PREV_DIR="$APP_DIR/previous"

            cd "$APP_DIR"

            echo "📦 Unpacking new release..."
            rm -rf "$NEXT_DIR"
            mkdir -p "$NEXT_DIR"
            tar -xzf release.tar.gz -C "$NEXT_DIR"
            test -f "$NEXT_DIR/server.js"
            test -d "$NEXT_DIR/.next/static/chunks"

            # 加载 NVM（root 用户）
            echo "🔧 Loading nvm..."
            export NVM_DIR="/root/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 26 --silent || true

            echo "Node: $(node -v)"
            echo "PM2: $(pm2 -v)"

            # PM2 部署
            echo "🛑 Stopping old instance..."
            pm2 delete 0xsnickers-website 2>/dev/null || true

            echo "🔄 Switching release..."
            rm -rf "$PREV_DIR"
            if [ -d "$RELEASE_DIR" ]; then
              mv "$RELEASE_DIR" "$PREV_DIR"
            fi
            mv "$NEXT_DIR" "$RELEASE_DIR"

            echo "🚀 Starting PM2..."
            cd "$RELEASE_DIR"

            PORT=3000 \
            HOSTNAME=0.0.0.0 \
            NODE_ENV=production \
            NEXT_TELEMETRY_DISABLED=1 \
            pm2 start server.js \
              --name 0xsnickers-website \
              --env production \
              --update-env \
              --max-memory-restart 800M \
              --log "$APP_DIR/app.log" \
              --time

            pm2 save

            echo "✅ Deployment completed at $(date)"
            echo "📊 PM2 Status:"
            pm2 status
