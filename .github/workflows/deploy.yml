name: Deploy to Server

on:
  push:
    branches:
      - main

env:
  NODE_VERSION_BUILD: 20
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # 解决 Node 20 警告

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js for Build
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION_BUILD }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build Next.js (Standalone)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Pack release artifact
        run: |
          rm -rf release release.tar.gz
          mkdir -p release/.next/static

          cp -R .next/standalone/. release/
          cp -R .next/static release/.next/static
          cp -R public release/public || true

          if [ -f .env.production ]; then
            cp .env.production release/.env
          elif [ -f .env.local ]; then
            cp .env.local release/.env
          fi

          tar -czf release.tar.gz -C release .
          ls -lh release.tar.gz

      - name: Upload to Server (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "release.tar.gz"
          target: ${{ secrets.PROJECT_PATH }}
          overwrite: true

      - name: Activate Release on Server (PM2)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 10m
          script: |
            set -e

            APP_DIR="${{ secrets.PROJECT_PATH }}"
            RELEASE_DIR="$APP_DIR/current"
            NEXT_DIR="$APP_DIR/next-release"
            PREV_DIR="$APP_DIR/previous"

            cd "$APP_DIR"

            echo "📦 Unpacking new release..."
            rm -rf "$NEXT_DIR"
            mkdir -p "$NEXT_DIR"
            tar -xzf release.tar.gz -C "$NEXT_DIR"

            # 加载 NVM
            echo "🔧 Loading nvm..."
            if [ -s "$HOME/.nvm/nvm.sh" ]; then
              . "$HOME/.nvm/nvm.sh"
              nvm use 26 --silent || nvm use default --silent || true
            fi

            echo "Node: $(node -v)"

            # PM2 部署
            echo "🛑 Stopping old instance..."
            pm2 delete 0xsnickers-website 2>/dev/null || true

            echo "🔄 Switching to new release..."
            rm -rf "$PREV_DIR"
            [ -d "$RELEASE_DIR" ] && mv "$RELEASE_DIR" "$PREV_DIR"
            mv "$NEXT_DIR" "$RELEASE_DIR"

            echo "🚀 Starting PM2 daemon..."
            cd "$RELEASE_DIR"

            pm2 start server.js \
              --name 0xsnickers-website \
              --env production \
              --max-memory-restart 800M \
              --log "$APP_DIR/app.log" \
              --time

            pm2 save

            echo "✅ Deployment completed at $(date)"
            echo "📊 PM2 Status:"
            pm2 status